# Yerel Qwen (Ollama, OpenAI uyumlu API: http://localhost:11434/v1).
# NVIDIA GPU için `deploy` bölümü açık; Mac/CPU'da bu bölümü sil ya da Ollama'yı doğrudan kur.
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
volumes:
  ollama:
